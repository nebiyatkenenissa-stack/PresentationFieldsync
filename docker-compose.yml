services:
  db:
    image: postgres:16-alpine
    container_name: fieldsync-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-my13}
      POSTGRES_DB: ${DB_NAME:-fieldsync_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fieldsync_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: fieldsync-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5001:5000"
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: fieldsync-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "30001:80"

volumes:
  pgdata:
  uploads:
