<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img" aria-label="Queued records syncing from a phone to a central server">
  <defs>
    <marker id="ofArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#12694a"/>
    </marker>
  </defs>

  <!-- Phone on the left, already holding queued work -->
  <g transform="translate(20 44)">
    <rect x="0" y="0" width="56" height="92" rx="6" fill="#16324f"/>
    <rect x="5" y="7" width="46" height="70" rx="2" fill="#e8f2fb"/>
    <g fill="#16324f" opacity="0.85">
      <rect x="11" y="15" width="30" height="5" rx="2"/>
      <rect x="11" y="25" width="24" height="5" rx="2"/>
      <rect x="11" y="35" width="33" height="5" rx="2"/>
      <rect x="11" y="45" width="20" height="5" rx="2"/>
    </g>
    <circle cx="28" cy="64" r="9" fill="#12694a"/>
    <path d="M23 64 L27 68 L34 60" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="18" y="84" width="20" height="2.5" rx="1.2" fill="#8fa9c4"/>
  </g>

  <!-- Server stack on the right, the single source of truth -->
  <g transform="translate(148 46)">
    <ellipse cx="34" cy="6" rx="34" ry="9" fill="#16324f" stroke="#8fa9c4" stroke-width="2.5"/>
    <path d="M0 6 L0 26 A 34 9 0 0 0 68 26 L68 6" fill="#0f2740" stroke="#8fa9c4" stroke-width="2.5"/>
    <ellipse cx="34" cy="26" rx="34" ry="9" fill="none" stroke="#8fa9c4" stroke-width="2" opacity="0.8"/>
    <path d="M0 26 L0 46 A 34 9 0 0 0 68 46 L68 26" fill="#16324f" stroke="#8fa9c4" stroke-width="2.5"/>
    <ellipse cx="34" cy="46" rx="34" ry="9" fill="none" stroke="#8fa9c4" stroke-width="2" opacity="0.8"/>
    <path d="M0 46 L0 66 A 34 9 0 0 0 68 66 L68 46" fill="#0f2740" stroke="#8fa9c4" stroke-width="2.5"/>
    <ellipse cx="34" cy="66" rx="34" ry="9" fill="#16324f" stroke="#8fa9c4" stroke-width="2.5"/>
    <!-- Status LEDs -->
    <circle cx="20" cy="62" r="3" fill="#7fd6a8"/>
    <circle cx="30" cy="62" r="3" fill="#7fd6a8" opacity="0.6"/>
    <circle cx="40" cy="62" r="3" fill="#e6c15a" opacity="0.8"/>
  </g>

  <!-- Uplink: queued records leaving the device -->
  <path d="M84 78 C 104 66, 116 64, 138 68" fill="none" stroke="#12694a" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#ofArrow)"/>

  <!-- Downlink: confirmation returning -->
  <path d="M138 108 C 116 116, 104 116, 84 108" fill="none" stroke="#9c7a16" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#ofArrow)" opacity="0.9"/>

  <!-- Payloads in flight -->
  <g>
    <rect x="104" y="52" width="26" height="11" rx="2" fill="#12694a"/>
    <rect x="109" y="56" width="16" height="2.5" rx="1.2" fill="#ffffff" opacity="0.8"/>
    <rect x="110" y="118" width="26" height="11" rx="2" fill="#9c7a16"/>
    <rect x="115" y="122" width="16" height="2.5" rx="1.2" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Connectivity restored -->
  <g transform="translate(206 22)" fill="none" stroke="#12694a" stroke-width="3" stroke-linecap="round">
    <path d="M-14 0 A 18 18 0 0 1 14 0"/>
    <path d="M-24 10 A 30 30 0 0 1 24 10"/>
  </g>
  <circle cx="206" cy="36" r="4" fill="#12694a"/>

  <!-- Caption rail -->
  <rect x="96" y="156" width="48" height="4" rx="2" fill="#c3cddb"/>
</svg>
