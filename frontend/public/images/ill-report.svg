<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img" aria-label="A submitted field report with geotag and signature">
  <!-- Report sheet -->
  <rect x="46" y="18" width="128" height="148" rx="4" fill="#ffffff" stroke="#16324f" stroke-width="3"/>

  <!-- Clipboard tab at the top -->
  <rect x="88" y="10" width="44" height="18" rx="4" fill="#16324f"/>
  <rect x="102" y="4" width="16" height="10" rx="3" fill="#8fa9c4"/>

  <!-- Title bar on the document -->
  <rect x="60" y="36" width="72" height="8" rx="2" fill="#16324f"/>
  <rect x="60" y="50" width="44" height="5" rx="2" fill="#9c7a16"/>

  <!-- Field rows with tick marks: a completed report -->
  <g>
    <rect x="60" y="66" width="60" height="6" rx="2" fill="#c3cddb"/>
    <path d="M140 69 L144 73 L152 64" fill="none" stroke="#12694a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="60" y="84" width="72" height="6" rx="2" fill="#c3cddb"/>
    <path d="M140 87 L144 91 L152 82" fill="none" stroke="#12694a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="60" y="102" width="52" height="6" rx="2" fill="#c3cddb"/>
    <path d="M140 105 L144 109 L152 100" fill="none" stroke="#12694a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bar chart summary -->
  <g>
    <rect x="62" y="140" width="10" height="14" fill="#16324f" opacity="0.85"/>
    <rect x="78" y="132" width="10" height="22" fill="#16324f" opacity="0.7"/>
    <rect x="94" y="136" width="10" height="18" fill="#16324f" opacity="0.55"/>
    <rect x="110" y="124" width="10" height="30" fill="#9c7a16"/>
    <rect x="62" y="156" width="58" height="3" fill="#8fa9c4"/>
  </g>

  <!-- Geotag pin: field reports are location-bound -->
  <g transform="translate(184 44)">
    <path d="M0 26 C -13 12, -17 4, -17 -5 A 17 17 0 0 1 17 -5 C 17 4, 13 12, 0 26 Z" fill="#a32020"/>
    <circle cx="0" cy="-5" r="6" fill="#ffffff"/>
  </g>

  <!-- Signature stroke -->
  <path d="M136 132 C 144 120, 150 142, 158 128 C 164 118, 168 134, 174 126" fill="none" stroke="#16324f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="136" y="142" width="40" height="2.5" rx="1.2" fill="#8fa9c4"/>

  <!-- Submitted stamp -->
  <g transform="translate(206 128) rotate(-14)">
    <rect x="-30" y="-11" width="60" height="22" rx="3" fill="none" stroke="#12694a" stroke-width="2.5"/>
    <path d="M-16 0 L-6 9 L14 -10" fill="none" stroke="#12694a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
