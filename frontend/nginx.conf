server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Photo uploads. Multer rejects anything over 2 MB, and nginx's own default
    # is only 1 MB, so without this the client gets an opaque 413 from nginx
    # instead of multer's "file too large" message. 4 MB gives multer headroom
    # to be the component that actually rejects the file.
    client_max_body_size 4m;

    # Docker's embedded DNS server. This is needed because proxy_pass below
    # targets a variable: nginx then resolves the name per request instead of
    # once at startup, so a restarted backend container (which gets a new IP)
    # is picked up without bouncing the frontend.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Resolved at request time via the resolver above. Set at server scope so
    # every request re-reads it.
    set $fieldsync_backend http://backend:5000;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # The service worker and the app shell must never be served from cache,
    # otherwise clients keep booting an old bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Backend API -------------------------------------------------------
    # Proxying /api and /uploads here (rather than having the browser call
    # http://<host>:5001 directly) is what lets the whole app run on a single
    # port. That means one tunnel / port-forward / phone hotspot is enough to
    # use the app from any network, and it removes CORS entirely.
    #
    # `^~` is required on both: without it the regex block further down
    # (for .png/.jpg/... files) would win and try to serve /uploads/photos
    # from the static root, 404ing every uploaded image.
    location ^~ /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # $request_uri carries the path *and* the query string, which a
        # variable-form proxy_pass would otherwise drop.
        proxy_pass $fieldsync_backend$request_uri;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location ^~ /uploads/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_pass $fieldsync_backend$request_uri;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Only Vite's content-hashed output is safe to cache forever. `^~` is
    # required: without it the regex block below would win over this prefix
    # match and re-add the immutable header to hashed files as well.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything copied verbatim from public/ (favicon, PWA icons, hero images)
    # keeps its original filename, so it must be revalidated. Caching these
    # immutably would pin stale icons on already-installed PWA clients.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }
}
